<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 160" width="100%" height="160" role="img" aria-label="Robot kecil orange hitam terbang" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
  <defs>
    <linearGradient id="fmetal" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#3a3a41"/>
      <stop offset="1" stop-color="#0c0c0f"/>
    </linearGradient>
    <linearGradient id="forange" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#FFB454"/>
      <stop offset="0.55" stop-color="#FF6B00"/>
      <stop offset="1" stop-color="#B84300"/>
    </linearGradient>
    <linearGradient id="fflame" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#FFE3A8"/>
      <stop offset="0.45" stop-color="#FF8A1F"/>
      <stop offset="1" stop-color="#FF6B00" stop-opacity="0"/>
    </linearGradient>
    <linearGradient id="fgline" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#FF6B00" stop-opacity="0"/>
      <stop offset="0.5" stop-color="#FF6B00" stop-opacity="0.6"/>
      <stop offset="1" stop-color="#FF6B00" stop-opacity="0"/>
    </linearGradient>
    <filter id="fglow" x="-60%" y="-60%" width="220%" height="220%">
      <feGaussianBlur stdDeviation="2.5" result="b"/>
      <feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
  </defs>

  <!-- robot melintas dari kiri ke kanan -->
  <g>
    <animateTransform attributeName="transform" type="translate" from="-110 0" to="910 0" dur="14s" repeatCount="indefinite"/>

    <!-- bayangan di tanah (mengecil saat robot tinggi) -->
    <ellipse cx="0" cy="146" rx="14" ry="3" fill="#FF6B00" opacity="0.25">
      <animate attributeName="rx" values="14;9;14;17;14" keyTimes="0;.25;.5;.75;1" dur="3.5s" repeatCount="indefinite"/>
      <animate attributeName="opacity" values="0.25;0.12;0.25;0.32;0.25" keyTimes="0;.25;.5;.75;1" dur="3.5s" repeatCount="indefinite"/>
    </ellipse>

    <!-- gerak naik-turun bergelombang -->
    <g transform="translate(0,72)">
      <g>
        <animateTransform attributeName="transform" type="translate" values="0 0;0 -24;0 0;0 16;0 0" keyTimes="0;.25;.5;.75;1" dur="3.5s" repeatCount="indefinite" calcMode="spline" keySplines=".45 0 .55 1;.45 0 .55 1;.45 0 .55 1;.45 0 .55 1"/>

        <!-- percikan jejak -->
        <g filter="url(#fglow)" fill="#FF8C3A">
          <circle r="3"><animate attributeName="cx" values="-22;-90" dur="1s" repeatCount="indefinite"/><animate attributeName="cy" values="4;-6" dur="1s" repeatCount="indefinite"/><animate attributeName="opacity" values="0.9;0" dur="1s" repeatCount="indefinite"/><animate attributeName="r" values="3;0.5" dur="1s" repeatCount="indefinite"/></circle>
          <circle r="2.5"><animate attributeName="cx" values="-22;-90" dur="1s" begin="-0.33s" repeatCount="indefinite"/><animate attributeName="cy" values="8;16" dur="1s" begin="-0.33s" repeatCount="indefinite"/><animate attributeName="opacity" values="0.9;0" dur="1s" begin="-0.33s" repeatCount="indefinite"/><animate attributeName="r" values="2.5;0.5" dur="1s" begin="-0.33s" repeatCount="indefinite"/></circle>
          <circle r="2"><animate attributeName="cx" values="-22;-90" dur="1s" begin="-0.66s" repeatCount="indefinite"/><animate attributeName="cy" values="0;-2" dur="1s" begin="-0.66s" repeatCount="indefinite"/><animate attributeName="opacity" values="0.9;0" dur="1s" begin="-0.66s" repeatCount="indefinite"/><animate attributeName="r" values="2;0.4" dur="1s" begin="-0.66s" repeatCount="indefinite"/></circle>
        </g>

        <!-- melayang halus + miring ke depan -->
        <g>
          <animateTransform attributeName="transform" type="rotate" values="5;11;5" dur="1.4s" repeatCount="indefinite"/>

          <!-- api pendorong -->
          <g filter="url(#fglow)">
            <polygon fill="url(#fflame)">
              <animate attributeName="points" dur="0.18s" repeatCount="indefinite"
                values="-7,20 0,40 7,20;-7,20 0,50 7,20;-7,20 0,36 7,20;-7,20 0,40 7,20"/>
            </polygon>
            <polygon fill="#FFE3A8" opacity="0.85">
              <animate attributeName="points" dur="0.14s" repeatCount="indefinite"
                values="-3,20 0,30 3,20;-3,20 0,36 3,20;-3,20 0,27 3,20;-3,20 0,30 3,20"/>
            </polygon>
          </g>
          <rect x="-8" y="16" width="16" height="6" rx="2" fill="#111" stroke="#FF6B00" stroke-width="1.5"/>

          <!-- sayap / sirip kiri -->
          <path d="M-18,2 L-36,-8 L-32,8 Z" fill="url(#forange)">
            <animateTransform attributeName="transform" type="rotate" values="-14 -18 2;16 -18 2;-14 -18 2" dur="0.28s" repeatCount="indefinite"/>
          </path>
          <!-- sayap / sirip kanan -->
          <path d="M18,2 L36,-8 L32,8 Z" fill="url(#forange)">
            <animateTransform attributeName="transform" type="rotate" values="14 18 2;-16 18 2;14 18 2" dur="0.28s" repeatCount="indefinite"/>
          </path>

          <!-- badan -->
          <rect x="-19" y="-17" width="38" height="35" rx="15" fill="url(#fmetal)" stroke="#FF6B00" stroke-width="2.5"/>
          <path d="M-12,-14 Q0,-20 12,-14" fill="none" stroke="#FF6B00" stroke-width="2" opacity="0.7" stroke-linecap="round"/>

          <!-- layar wajah -->
          <rect x="-14" y="-9" width="28" height="16" rx="8" fill="#08080a" stroke="#FF6B00" stroke-width="1.2"/>
          <g filter="url(#fglow)" fill="#FF6B00">
            <ellipse cx="-5.5" cy="-1.5" rx="3" ry="3"><animate attributeName="ry" values="3;3;0.4;3" keyTimes="0;.92;.96;1" dur="3.5s" repeatCount="indefinite"/></ellipse>
            <ellipse cx="5.5" cy="-1.5" rx="3" ry="3"><animate attributeName="ry" values="3;3;0.4;3" keyTimes="0;.92;.96;1" dur="3.5s" repeatCount="indefinite"/></ellipse>
          </g>
          <path d="M-3,3 Q0,5.5 3,3" fill="none" stroke="#FF6B00" stroke-width="1.2" stroke-linecap="round"/>

          <!-- lampu dada -->
          <circle cx="0" cy="12.5" r="2.2" fill="#FFB454" filter="url(#fglow)">
            <animate attributeName="opacity" values="1;0.25;1" dur="0.9s" repeatCount="indefinite"/>
          </circle>

          <!-- baling-baling atas -->
          <line x1="0" y1="-17" x2="0" y2="-25" stroke="#FF6B00" stroke-width="2.5" stroke-linecap="round"/>
          <ellipse cx="0" cy="-27" rx="24" ry="2.4" fill="url(#forange)" opacity="0.9">
            <animate attributeName="rx" values="24;5;24" dur="0.16s" repeatCount="indefinite"/>
          </ellipse>
          <circle cx="0" cy="-27" r="2.6" fill="#111" stroke="#FF6B00" stroke-width="1.2"/>

          <!-- antena kecil -->
          <line x1="12" y1="-15" x2="18" y2="-26" stroke="#FF6B00" stroke-width="1.8" stroke-linecap="round"/>
          <circle cx="18" cy="-27" r="2.6" fill="#FF6B00" filter="url(#fglow)">
            <animate attributeName="opacity" values="1;0.2;1" dur="0.7s" repeatCount="indefinite"/>
          </circle>
        </g>
      </g>
    </g>
  </g>
</svg>
