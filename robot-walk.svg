<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 160" width="100%" height="160" role="img" aria-label="Robot mech orange hitam berlari" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
  <defs>
    <linearGradient id="metal" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#34343a"/>
      <stop offset="1" stop-color="#0c0c0f"/>
    </linearGradient>
    <linearGradient id="orange" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#FFB454"/>
      <stop offset="0.5" stop-color="#FF6B00"/>
      <stop offset="1" stop-color="#B84300"/>
    </linearGradient>
    <linearGradient id="flame" x1="1" y1="0" x2="0" y2="0">
      <stop offset="0" stop-color="#FFE3A8"/>
      <stop offset="0.4" stop-color="#FF8A1F"/>
      <stop offset="1" stop-color="#FF6B00" stop-opacity="0"/>
    </linearGradient>
    <linearGradient id="gline" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#FF6B00" stop-opacity="0"/>
      <stop offset="0.5" stop-color="#FF6B00" stop-opacity="0.9"/>
      <stop offset="1" stop-color="#FF6B00" stop-opacity="0"/>
    </linearGradient>
    <filter id="glow" x="-60%" y="-60%" width="220%" height="220%">
      <feGaussianBlur stdDeviation="2.5" result="b"/>
      <feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
  </defs>

  <!-- tanah -->
  <rect x="0" y="140" width="800" height="2" fill="url(#gline)"/>
  <path d="M0 150 H800" stroke="#FF6B00" stroke-width="2" stroke-dasharray="16 12" opacity="0.55">
    <animate attributeName="stroke-dashoffset" from="0" to="28" dur="0.45s" repeatCount="indefinite"/>
  </path>
  <path d="M0 157 H800" stroke="#FF6B00" stroke-width="1.5" stroke-dasharray="6 18" opacity="0.3">
    <animate attributeName="stroke-dashoffset" from="0" to="24" dur="0.3s" repeatCount="indefinite"/>
  </path>

  <!-- robot bergerak melintasi layar -->
  <g>
    <animateTransform attributeName="transform" type="translate" from="-140 140" to="920 140" dur="12s" repeatCount="indefinite"/>

    <!-- bayangan -->
    <ellipse cx="0" cy="2" rx="30" ry="4" fill="#000" opacity="0.35">
      <animate attributeName="rx" values="30;24;30" dur="0.4s" repeatCount="indefinite"/>
    </ellipse>

    <!-- garis kecepatan -->
    <g stroke="#FF6B00" stroke-linecap="round" filter="url(#glow)">
      <line x1="-70" y1="-90" x2="-120" y2="-90" stroke-width="2"><animate attributeName="opacity" values="0;0.9;0" dur="0.5s" repeatCount="indefinite"/></line>
      <line x1="-62" y1="-30" x2="-130" y2="-30" stroke-width="2"><animate attributeName="opacity" values="0;0.9;0" dur="0.5s" begin="-0.2s" repeatCount="indefinite"/></line>
      <line x1="-60" y1="-18" x2="-100" y2="-18" stroke-width="1.5"><animate attributeName="opacity" values="0;0.8;0" dur="0.5s" begin="-0.35s" repeatCount="indefinite"/></line>
    </g>

    <!-- debu di kaki -->
    <circle cx="-8" cy="-2" r="3" fill="#FF8C3A">
      <animate attributeName="cx" values="-8;-44" dur="0.8s" repeatCount="indefinite"/>
      <animate attributeName="cy" values="-2;-16" dur="0.8s" repeatCount="indefinite"/>
      <animate attributeName="r" values="3;0.5" dur="0.8s" repeatCount="indefinite"/>
      <animate attributeName="opacity" values="0.8;0" dur="0.8s" repeatCount="indefinite"/>
    </circle>
    <circle cx="-8" cy="-2" r="3" fill="#FF8C3A">
      <animate attributeName="cx" values="-8;-44" dur="0.8s" begin="-0.4s" repeatCount="indefinite"/>
      <animate attributeName="cy" values="-2;-16" dur="0.8s" begin="-0.4s" repeatCount="indefinite"/>
      <animate attributeName="r" values="3;0.5" dur="0.8s" begin="-0.4s" repeatCount="indefinite"/>
      <animate attributeName="opacity" values="0.8;0" dur="0.8s" begin="-0.4s" repeatCount="indefinite"/>
    </circle>

    <!-- badan bergoyang naik-turun + condong ke depan -->
    <g>
      <animateTransform attributeName="transform" type="translate" values="0 0;0 -3;0 0" dur="0.4s" repeatCount="indefinite"/>
      <g transform="rotate(7)">

        <!-- jetpack + api -->
        <rect x="-28" y="-76" width="12" height="30" rx="4" fill="url(#metal)" stroke="#FF6B00" stroke-width="1.5"/>
        <g filter="url(#glow)">
          <polygon fill="url(#flame)">
            <animate attributeName="points" dur="0.18s" repeatCount="indefinite"
              values="-28,-68 -62,-62 -28,-56;-28,-68 -78,-62 -28,-56;-28,-68 -56,-62 -28,-56;-28,-68 -62,-62 -28,-56"/>
          </polygon>
          <polygon fill="#FFE3A8" opacity="0.85">
            <animate attributeName="points" dur="0.14s" repeatCount="indefinite"
              values="-28,-65 -44,-62 -28,-59;-28,-65 -52,-62 -28,-59;-28,-65 -40,-62 -28,-59;-28,-65 -44,-62 -28,-59"/>
          </polygon>
        </g>

        <!-- lengan belakang -->
        <g transform="translate(0,-80)" opacity="0.7">
          <g>
            <animateTransform attributeName="transform" type="rotate" values="-35 0 0;35 0 0;-35 0 0" dur="0.8s" begin="-0.4s" repeatCount="indefinite" calcMode="spline" keyTimes="0;.5;1" keySplines=".45 0 .55 1;.45 0 .55 1"/>
            <rect x="-4" y="0" width="8" height="16" rx="4" fill="url(#metal)" stroke="#FF6B00" stroke-width="1.5"/>
            <g transform="translate(0,16) rotate(-50)">
              <rect x="-3.5" y="0" width="7" height="14" rx="3" fill="url(#orange)"/>
              <circle cx="0" cy="16" r="4.5" fill="#111" stroke="#FF6B00" stroke-width="1.5"/>
            </g>
            <rect x="-8" y="-6" width="16" height="11" rx="4" fill="url(#orange)"/>
          </g>
        </g>

        <!-- kaki belakang -->
        <g transform="translate(-4,-46)" opacity="0.8">
          <g>
            <animateTransform attributeName="transform" type="rotate" values="35 0 0;-35 0 0;35 0 0" dur="0.8s" begin="-0.4s" repeatCount="indefinite" calcMode="spline" keyTimes="0;.5;1" keySplines=".45 0 .55 1;.45 0 .55 1"/>
            <rect x="-5" y="0" width="10" height="22" rx="4" fill="url(#metal)" stroke="#FF6B00" stroke-width="1.5"/>
            <circle cx="0" cy="0" r="4.5" fill="#FF6B00"/>
            <g transform="translate(0,22)">
              <g>
                <animateTransform attributeName="transform" type="rotate" values="30 0 0;80 0 0;10 0 0;5 0 0;30 0 0" keyTimes="0;.25;.5;.75;1" dur="0.8s" begin="-0.4s" repeatCount="indefinite"/>
                <circle cx="0" cy="0" r="3.5" fill="#FF6B00"/>
                <rect x="-4" y="0" width="8" height="20" rx="3" fill="url(#orange)"/>
                <rect x="-1.5" y="4" width="3" height="10" rx="1.5" fill="#111"/>
                <path d="M-5,18 L10,18 L12,24 L-6,24 Z" fill="#111" stroke="#FF6B00" stroke-width="1.5"/>
              </g>
            </g>
          </g>
        </g>

        <!-- badan utama -->
        <path d="M-16,-80 L14,-80 L19,-62 L11,-46 L-13,-46 L-19,-62 Z" fill="url(#metal)" stroke="#FF6B00" stroke-width="2"/>
        <path d="M-12,-76 L10,-76 L12,-70 L-14,-70 Z" fill="url(#orange)" opacity="0.9"/>
        <rect x="-13" y="-52" width="26" height="6" rx="2" fill="url(#orange)"/>
        <!-- inti energi -->
        <circle cx="0" cy="-62" r="7" fill="none" stroke="#FF6B00" stroke-width="1.5" opacity="0.7"/>
        <circle cx="0" cy="-62" r="4.5" fill="#FFB454" filter="url(#glow)">
          <animate attributeName="opacity" values="1;0.35;1" dur="0.9s" repeatCount="indefinite"/>
          <animate attributeName="r" values="4.5;3.5;4.5" dur="0.9s" repeatCount="indefinite"/>
        </circle>

        <!-- kaki depan -->
        <g transform="translate(4,-46)">
          <g>
            <animateTransform attributeName="transform" type="rotate" values="35 0 0;-35 0 0;35 0 0" dur="0.8s" repeatCount="indefinite" calcMode="spline" keyTimes="0;.5;1" keySplines=".45 0 .55 1;.45 0 .55 1"/>
            <rect x="-5" y="0" width="10" height="22" rx="4" fill="url(#metal)" stroke="#FF6B00" stroke-width="1.5"/>
            <circle cx="0" cy="0" r="4.5" fill="#FF6B00"/>
            <g transform="translate(0,22)">
              <g>
                <animateTransform attributeName="transform" type="rotate" values="30 0 0;80 0 0;10 0 0;5 0 0;30 0 0" keyTimes="0;.25;.5;.75;1" dur="0.8s" repeatCount="indefinite"/>
                <circle cx="0" cy="0" r="3.5" fill="#FF6B00"/>
                <rect x="-4" y="0" width="8" height="20" rx="3" fill="url(#orange)"/>
                <rect x="-1.5" y="4" width="3" height="10" rx="1.5" fill="#111"/>
                <path d="M-5,18 L10,18 L12,24 L-6,24 Z" fill="#111" stroke="#FF6B00" stroke-width="1.5"/>
              </g>
            </g>
          </g>
        </g>

        <!-- kepala / helm -->
        <path d="M-14,-84 L-9,-101 L8,-101 L16,-90 L14,-78 L-12,-78 Z" fill="url(#metal)" stroke="#FF6B00" stroke-width="2"/>
        <path d="M-14,-98 L-30,-108 L-12,-90 Z" fill="url(#orange)">
          <animateTransform attributeName="transform" type="rotate" values="0 -12 -92;-8 -12 -92;0 -12 -92" dur="0.4s" repeatCount="indefinite"/>
        </path>
        <!-- visor -->
        <path d="M0,-94 L16,-91 L14,-84 L0,-85 Z" fill="#FF6B00" filter="url(#glow)">
          <animate attributeName="opacity" values="1;0.75;1" dur="1.2s" repeatCount="indefinite"/>
        </path>
        <rect x="-8" y="-98" width="8" height="3" rx="1.5" fill="#FF6B00" opacity="0.8"/>

        <!-- lengan depan -->
        <g transform="translate(0,-80)">
          <g>
            <animateTransform attributeName="transform" type="rotate" values="-35 0 0;35 0 0;-35 0 0" dur="0.8s" repeatCount="indefinite" calcMode="spline" keyTimes="0;.5;1" keySplines=".45 0 .55 1;.45 0 .55 1"/>
            <rect x="-4" y="0" width="8" height="16" rx="4" fill="url(#metal)" stroke="#FF6B00" stroke-width="1.5"/>
            <g transform="translate(0,16) rotate(-50)">
              <rect x="-3.5" y="0" width="7" height="14" rx="3" fill="url(#orange)"/>
              <circle cx="0" cy="16" r="4.5" fill="#111" stroke="#FF6B00" stroke-width="1.5"/>
            </g>
            <rect x="-8" y="-6" width="16" height="11" rx="4" fill="url(#orange)"/>
          </g>
        </g>

      </g>
    </g>
  </g>
</svg>
