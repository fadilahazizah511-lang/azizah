<svg xmlns="http://www.w3.org/2000/svg" width="800" height="350" viewBox="0 0 800 350" role="img" aria-label="About Junizar Maulana" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
  <title>About Junizar Maulana</title>
  <defs>
    <linearGradient id="bar" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#1a1a1a"/>
      <stop offset="1" stop-color="#2a1708"/>
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="4" result="b"/>
      <feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
  </defs>

  <style>
    text { font-family: 'Fira Code', 'JetBrains Mono', Consolas, 'Courier New', monospace; font-size: 17px; }
    .org { fill: #FF6B00; }
    .wht { fill: #F5F5F5; }
    .gry { fill: #777777; }
    .cover { fill: #0D0D0D; transform-box: fill-box; transform-origin: 100% 50%; animation-duration: 13s; animation-iteration-count: infinite; animation-timing-function: steps(28, end); }
    .l0 { animation-name: t0; } .l1 { animation-name: t1; } .l2 { animation-name: t2; }
    .l3 { animation-name: t3; } .l4 { animation-name: t4; } .l5 { animation-name: t5; }
    @keyframes t0 { 0%,4.6% {transform:scaleX(1)} 12.3%,94% {transform:scaleX(0)} 96%,100% {transform:scaleX(1)} }
    @keyframes t1 { 0%,14.6% {transform:scaleX(1)} 22.3%,94% {transform:scaleX(0)} 96%,100% {transform:scaleX(1)} }
    @keyframes t2 { 0%,24.6% {transform:scaleX(1)} 32.3%,94% {transform:scaleX(0)} 96%,100% {transform:scaleX(1)} }
    @keyframes t3 { 0%,34.6% {transform:scaleX(1)} 42.3%,94% {transform:scaleX(0)} 96%,100% {transform:scaleX(1)} }
    @keyframes t4 { 0%,44.6% {transform:scaleX(1)} 52.3%,94% {transform:scaleX(0)} 96%,100% {transform:scaleX(1)} }
    @keyframes t5 { 0%,54.6% {transform:scaleX(1)} 62.3%,94% {transform:scaleX(0)} 96%,100% {transform:scaleX(1)} }
    .cursor { fill: #FF6B00; animation: blink 1s steps(1) infinite; }
    @keyframes blink { 0%,50% {opacity:1} 50.01%,100% {opacity:0} }
    .border { animation: pulse 3s ease-in-out infinite; }
    @keyframes pulse { 0%,100% {stroke-opacity:.55} 50% {stroke-opacity:1} }
  </style>

  <!-- Window -->
  <rect class="border" x="10" y="10" width="780" height="330" rx="14" fill="#0D0D0D" stroke="#FF6B00" stroke-width="2" filter="url(#glow)"/>
  <path d="M10 24 a14 14 0 0 1 14 -14 H776 a14 14 0 0 1 14 14 V50 H10 Z" fill="url(#bar)"/>
  <circle cx="36" cy="30" r="6" fill="#FF6B00"/>
  <circle cx="58" cy="30" r="6" fill="#FF9A4D"/>
  <circle cx="80" cy="30" r="6" fill="#5a5a5a"/>
  <text x="400" y="36" text-anchor="middle" class="gry" style="font-size:13px">junizar@workspace: ~/about</text>

  <!-- Lines -->
  <g>
    <text x="40" y="100"><tspan class="org">$ </tspan><tspan x="70" class="org">name</tspan><tspan x="230" class="gry">:</tspan><tspan x="250" class="wht">Junizar Maulana</tspan></text>
    <text x="40" y="136"><tspan class="org">$ </tspan><tspan x="70" class="org">role</tspan><tspan x="230" class="gry">:</tspan><tspan x="250" class="wht">Embodied AI</tspan></text>
    <text x="40" y="172"><tspan class="org">$ </tspan><tspan x="70" class="org">side_job</tspan><tspan x="230" class="gry">:</tspan><tspan x="250" class="wht">Mobile Phone Hardware Repair</tspan></text>
    <text x="40" y="208"><tspan class="org">$ </tspan><tspan x="70" class="org">focus</tspan><tspan x="230" class="gry">:</tspan><tspan x="250" class="wht">Mobile · Web · AI · Mikrokontroler AI</tspan></text>
    <text x="40" y="244"><tspan class="org">$ </tspan><tspan x="70" class="org">learning</tspan><tspan x="230" class="gry">:</tspan><tspan x="250" class="wht">Flutter · Firebase · Agent AI</tspan></text>
    <text x="40" y="280"><tspan class="org">$ </tspan><tspan x="70" class="org">motto</tspan><tspan x="230" class="gry">:</tspan><tspan x="250" class="wht">"Make the Impossible."</tspan></text>
    <text x="40" y="316"><tspan class="org">$ </tspan></text>
    <rect class="cursor" x="62" y="302" width="10" height="18"/>
  </g>

  <!-- Penutup yang membuka teks seperti efek mengetik -->
  <rect class="cover l0" x="30" y="78" width="740" height="30"/>
  <rect class="cover l1" x="30" y="114" width="740" height="30"/>
  <rect class="cover l2" x="30" y="150" width="740" height="30"/>
  <rect class="cover l3" x="30" y="186" width="740" height="30"/>
  <rect class="cover l4" x="30" y="222" width="740" height="30"/>
  <rect class="cover l5" x="30" y="258" width="740" height="30"/>
</svg>
